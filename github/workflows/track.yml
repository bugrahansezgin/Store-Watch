name: Daily check

on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC (08:17 Istanbul)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: store-watch
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/track.py
      - name: Commit snapshot
        run: |
          git config user.name  "store-watch-bot"
          git config user.email "store-watch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "check: $(date -u +%F)"
          git push
