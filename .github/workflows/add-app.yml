name: Add app

on:
  workflow_dispatch:
    inputs:
      url:
        description: "App Store link (e.g. https://apps.apple.com/us/app/name/id123456789)"
        required: true
      country:
        description: "Store country code (leave empty to read it from the link)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: store-watch
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/add_app.py "$APP_URL" "$APP_COUNTRY"
        env:
          APP_URL: ${{ inputs.url }}
          APP_COUNTRY: ${{ inputs.country }}
      - run: python scripts/track.py && python scripts/reviews.py && python scripts/history.py   # baseline right away
      - run: |
          git config user.name  "store-watch-bot"
          git config user.email "store-watch-bot@users.noreply.github.com"
          git add apps.json data
          git diff --cached --quiet || git commit -m "watch: add app"
          git push
