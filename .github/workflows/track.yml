name: Daily check

on:
  schedule:
    - cron: "17 5 * * *"   # every day 08:17 Istanbul
  workflow_dispatch:
    inputs:
      force_summary:
        description: "Rebuild AI summaries from scratch (re-reads all reviews)"
        type: boolean
        default: false

permissions:
  contents: write
  models: read   # free GitHub Models access for AI summaries

concurrency:
  group: store-watch
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet --upgrade google-play-scraper   # Google Play support

      - name: Listings & screenshots
        run: python scripts/track.py

      - name: Reviews
        run: python scripts/reviews.py
        continue-on-error: true

      - name: Version & description history
        run: python scripts/history.py
        continue-on-error: true

      - name: AI review summary (new reviews only)
        run: python scripts/summarize.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_FORCE: ${{ inputs.force_summary }}

      - name: Commit snapshot
        run: |
          git config user.name  "store-watch-bot"
          git config user.email "store-watch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "check: $(date -u +%F)"
          git push
