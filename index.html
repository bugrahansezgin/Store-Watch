<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Watch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111'/><circle cx='16' cy='16' r='6' fill='none' stroke='%23c6f36b' stroke-width='3'/></svg>">
<style>
:root{
  --bg:#f7f7f5; --surface:#fff; --surface-2:#f3f3f1; --line:#e7e7e3; --line-strong:#d9d9d4;
  --text:#111110; --text-2:#5f5f5b; --text-3:#8f8f8a;
  --accent:#b8ec5a; --accent-ink:#2f4a05; --accent-soft:#eefad6;
  --add:#1f8a4c; --add-soft:#e7f6ec; --add-line:#9fd8b5;
  --rem:#c2352b; --rem-soft:#fcebea; --rem-line:#efb1ac;
  --move:#8a5a00; --move-soft:#fdf3dc;
  --chip-shots:#7a3cf0; --chip-shots-bg:#f1eafe;
  --chip-rel:#1f7a4a; --chip-rel-bg:#e6f5ec;
  --chip-price:#b35a00; --chip-price-bg:#fdf0e1;
  --chip-rate:#5f5f5b; --chip-rate-bg:#efefec;
  --chip-icon:#0b6bcb; --chip-icon-bg:#e5f0fc;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0d; --surface:#171716; --surface-2:#1f1f1d; --line:#2a2a28; --line-strong:#363633;
    --text:#f2f2ef; --text-2:#a9a9a3; --text-3:#76766f;
    --accent:#b8ec5a; --accent-ink:#1d2e03; --accent-soft:#26340f;
    --add:#5fd08e; --add-soft:#12291b; --add-line:#2c6b45;
    --rem:#f07a70; --rem-soft:#2e1614; --rem-line:#7a332d;
    --move:#e9b44c; --move-soft:#2c2210;
    --chip-shots:#b89bff; --chip-shots-bg:#231a38;
    --chip-rel:#6fd29a; --chip-rel-bg:#14281c;
    --chip-price:#f2a655; --chip-price-bg:#2e1f0e;
    --chip-rate:#b5b5ae; --chip-rate-bg:#262624;
    --chip-icon:#72b2f5; --chip-icon-bg:#12233a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:30px;letter-spacing:-.02em;margin:0;font-weight:700}
.sub{color:var(--text-2);margin:6px 0 0;max-width:680px}
.meta{color:var(--text-3);font-size:13px}
.tabs{display:flex;gap:4px;margin:28px 0 20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px 12px;display:flex;align-items:center;gap:8px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.count{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--text-2);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .count{background:var(--accent-soft);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"] .count{color:var(--accent)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-width:100%}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--text-2);white-space:nowrap;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select,input[type=search]{font:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:10px;padding:7px 10px}
input[type=search]{min-width:200px;flex:1;max-width:280px}
.spacer{flex:1}
.day{padding:10px 20px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;align-items:start}
.row:hover{background:var(--surface-2)}
.icon{width:48px;height:48px;border-radius:11px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2)}
.icon.lg{width:64px;height:64px;border-radius:14px}
.row-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:500}
.row-sum{color:var(--text-2);font-size:14px;margin-top:2px}
.row-right{display:flex;gap:12px;align-items:center;color:var(--text-3);font-size:13px;white-space:nowrap}
.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:8px}
.chip svg{width:13px;height:13px}
.t-screenshots{color:var(--chip-shots);background:var(--chip-shots-bg)}
.t-release{color:var(--chip-rel);background:var(--chip-rel-bg)}
.t-price{color:var(--chip-price);background:var(--chip-price-bg)}
.t-reviews{color:var(--chip-shots);background:var(--chip-shots-bg)}
.t-rating,.t-description,.t-title,.t-tracking{color:var(--chip-rate);background:var(--chip-rate-bg)}
.t-icon{color:var(--chip-icon);background:var(--chip-icon-bg)}
.ba{display:flex;gap:10px;margin-top:10px}
.ba figure{margin:0;text-align:center;font-size:12px;color:var(--text-3)}
.ba img{width:44px;height:78px;object-fit:cover;border-radius:7px;display:block;margin-bottom:4px}
.ba .b img{outline:2px solid var(--rem-line)} .ba .a img{outline:2px solid var(--add-line)}
.empty{padding:56px 24px;text-align:center;color:var(--text-2)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

/* detail */
.dhead{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.back{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:none}
.dname{font-size:19px;font-weight:600;letter-spacing:-.01em}
.dbody{padding:22px 20px 28px}
.dtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.dsum{color:var(--text-2);margin:0 0 22px}
.viewtoggle{margin-bottom:18px}
.sect{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:22px 0 10px}
.sect.add{color:var(--add)} .sect.rem{color:var(--rem)}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.shot{flex:none;width:150px;scroll-snap-align:start;cursor:zoom-in;border:0;padding:0;background:none;text-align:left}
.shot img{width:150px;aspect-ratio:392/848;object-fit:cover;border-radius:14px;display:block;background:var(--surface-2);border:3px solid var(--line)}
.shot.add img{border-color:var(--add-line)} .shot.rem img{border-color:var(--rem-line)}
.shot .cap{font-size:12px;color:var(--text-3);margin-top:6px}
.cmp{display:grid;grid-template-columns:40px 1fr 1fr;gap:10px 16px;align-items:start}
.cmp .h{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding-bottom:4px}
.slot{font-variant-numeric:tabular-nums;color:var(--text-3);font-size:13px;padding-top:8px}
.cell{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);min-height:120px}
.cell img{width:92px;aspect-ratio:392/848;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--surface)}
.cell .none{width:92px;aspect-ratio:392/848;border-radius:10px;border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--text-3);font-size:12px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.b-new{background:var(--add-soft);color:var(--add)} .b-rem{background:var(--rem-soft);color:var(--rem)}
.b-rep{background:var(--chip-shots-bg);color:var(--chip-shots)} .b-move{background:var(--move-soft);color:var(--move)}
.b-same{background:var(--surface);color:var(--text-3);border:1px solid var(--line)}
.cell.changed{background:var(--surface);border-color:var(--line-strong)}
.textdiff{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.textdiff pre{white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;max-height:520px;overflow:auto}
.textdiff .del{background:var(--rem-soft);color:var(--rem)} .textdiff .ins{background:var(--add-soft);color:var(--add)}
.kv{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.kv .v{font-size:28px;font-weight:600;letter-spacing:-.02em}
.kv .arrow{color:var(--text-3);font-size:22px}
.notes{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text-2);font-size:14px}

.cmpx{display:grid;grid-template-columns:64px repeat(var(--n),150px);gap:10px 12px;overflow-x:auto;padding:2px 2px 12px;align-items:start}
.rowlab{position:sticky;left:0;z-index:1;background:var(--surface);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding-top:8px;align-self:stretch}
.rowlab small{display:block;font-weight:500;letter-spacing:0;font-size:12px;margin-top:2px}
.colh{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums;min-height:24px}
.tile{border:0;padding:0;background:none;cursor:zoom-in;display:block;width:150px}
.tile img{width:150px;aspect-ratio:392/848;object-fit:cover;border-radius:14px;display:block;border:3px solid var(--line);background:var(--surface-2);transition:opacity .15s}
.tile:not(.chg) img{opacity:.45}
.tile:not(.chg):hover img{opacity:1}
.tile.chg.a img{border-color:var(--add-line)} .tile.chg.b img{border-color:var(--rem-line)}
.tile.none{cursor:default;width:150px;aspect-ratio:392/848;border-radius:14px;border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--text-3)}
.viewtoggle{display:inline-flex}

/* watchlist */
.grid{display:grid;gap:14px}
.app{padding:18px 20px}
.app-top{display:flex;gap:14px;align-items:center}
.app-name{font-weight:600;font-size:16px}
.app-dev{color:var(--text-2);font-size:13px}
.app-stats{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 4px;font-size:13px;color:var(--text-2)}
.app-stats b{color:var(--text);font-weight:600}
.mini{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.mini img{height:150px;aspect-ratio:392/848;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;text-decoration:none;font-weight:500}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.app-actions{display:flex;gap:8px;margin-left:auto}


.pill.store{display:inline-flex;align-items:center;gap:5px}
.pill.store svg{opacity:.7}
.app-dev .pill.store{margin-right:4px;font-size:11.5px;padding:1px 7px}
.mini.play img,.strip.play .shot img{object-fit:contain;background:var(--surface-2)}
.reply{margin:6px 0 8px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13.5px;color:var(--text-2)}
.reply b{display:block;color:var(--text);font-size:12px;margin-bottom:2px}
.ai-pt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mentions{font-size:12px;font-weight:600;color:var(--text-3);background:var(--surface-2);border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums;flex:none}
.ai-delta{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--text-2)}
.ai-delta b{display:block;color:var(--chip-shots);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.ai-err{margin:10px 0 0;font-size:13px;color:var(--rem);background:var(--rem-soft);border-radius:8px;padding:8px 10px;word-break:break-word}
.ai-err b{margin-right:4px}
.store-logo{width:14px;height:14px;border-radius:3px;flex:none}
.pill.store .store-logo{width:12px;height:12px}
.store-seg{flex:none}
.seg .with-logo{display:inline-flex;align-items:center;gap:6px}
.store-seg a,.store-seg span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;font-size:13.5px;text-decoration:none;color:var(--text-2);white-space:nowrap}
.store-seg a[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.store-seg a:not([aria-pressed="true"]):hover{color:var(--text)}
.store-seg .off{opacity:.4;cursor:not-allowed}
.store-seg .off .store-logo{filter:grayscale(1)}
.dhead-right{margin-left:auto;flex:none}
@media (max-width:720px){ .dhead{flex-wrap:wrap} .dhead-right{margin-left:0;width:100%} .app-actions{flex-wrap:wrap;margin-left:0;width:100%} .app-top{flex-wrap:wrap} }
.app-lines{display:grid;gap:8px;margin-top:12px}
.app-lines .app-ai{margin-top:0}
.app-ai svg{color:var(--text-3)} .app-ai:last-child svg{color:var(--chip-shots)}
.app-lines .app-ai:first-child svg{color:#f5a524}
.row-ai{display:flex;gap:6px;align-items:flex-start;margin-top:4px;font-size:13.5px;color:var(--text-2)}
.row-ai svg{flex:none;margin-top:3px;color:var(--chip-shots)}
.ai-grid.two{grid-template-columns:2fr 1fr}
ul.plain{margin:0;padding-left:18px;color:var(--text-2);font-size:14px;display:grid;gap:6px}
.v-ai{margin:2px 0 10px}
.v-sum{display:flex;gap:6px;align-items:flex-start;margin:0 0 8px;font-weight:500}
.v-sum svg{flex:none;margin-top:3px;color:var(--chip-shots)}
.v-lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.vl{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.vl span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.vl ul{margin:4px 0 0;padding-left:16px;font-size:13.5px;color:var(--text-2);display:grid;gap:3px}
.vl.add span{color:var(--add)} .vl.chg span{color:var(--chip-icon)} .vl.rem span{color:var(--rem)} .vl.fix span{color:var(--text-3)}
.notes-d summary{cursor:pointer;font-size:13px;color:var(--text-3);margin-bottom:6px}
@media (max-width:820px){ .ai-grid.two{grid-template-columns:1fr} }
/* watchlist: 2-column cards */
.grid.wl{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.grid.wl .app{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid.wl .app-top{gap:12px}
.grid.wl .icon.lg{width:52px;height:52px;border-radius:12px}
.app-id{min-width:0;flex:1}
.app-id .app-name,.app-id .app-dev{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn.ghost{background:transparent}
.grid.wl .app-stats{margin:0;gap:6px 14px}
.grid.wl .mini{padding:0}
.grid.wl .mini img{height:128px}
.grid.wl .app-lines{margin-top:auto}
.grid.wl .app-ai{padding:9px 11px;font-size:13.5px}
.grid.wl .app-ai span{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:900px){ .grid.wl{grid-template-columns:1fr} }
/* app page */
.subtabs{display:flex;gap:4px;padding:0 20px;box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.subtabs::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.subtab{padding:12px 12px 11px;text-decoration:none;color:var(--text-2);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap;flex:none}
.subtab[aria-current="true"]{color:var(--text);border-color:var(--accent)}
a.app-name{text-decoration:none} a.app-name:hover{text-decoration:underline}
.app-ai{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);text-decoration:none;font-size:14px;color:var(--text-2)}
.app-ai svg{flex:none;margin-top:3px;color:var(--chip-shots)} .app-ai b{color:var(--text)} .app-ai .meta{margin-left:auto;white-space:nowrap}
.ai{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:22px;background:linear-gradient(180deg,var(--chip-shots-bg),transparent 140px)}
.ai-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ai-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--chip-shots);text-transform:uppercase;letter-spacing:.05em}
.sent{font-size:12px;text-transform:none;letter-spacing:0;padding:1px 8px;border-radius:99px;font-weight:600}
.s-positive{background:var(--add-soft);color:var(--add)} .s-negative{background:var(--rem-soft);color:var(--rem)} .s-mixed{background:var(--move-soft);color:var(--move)}
.ai-headline{font-size:20px;letter-spacing:-.015em;margin:10px 0 4px;line-height:1.3}
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.ai-col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.ai-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.c-love .ai-h{color:var(--add)} .c-pain .ai-h{color:var(--rem)} .c-req .ai-h{color:var(--chip-icon)}
.ai-item{padding:8px 0;border-top:1px solid var(--line)} .ai-item:first-of-type{border-top:0;padding-top:0}
.ai-item p{margin:2px 0 6px;color:var(--text-2);font-size:14px}
.q{display:block;font-size:13px;color:var(--text-3);text-decoration:none;padding:4px 8px;border-left:2px solid var(--line-strong);margin:4px 0}
.q:hover{color:var(--text);border-color:var(--accent)} .q b{color:var(--text-2);font-weight:600}
.ai-line,.ai-take{margin-top:12px;font-size:14px;color:var(--text-2);display:flex;gap:10px;flex-wrap:wrap}
.ai-line b,.ai-take b{color:var(--text);flex:none}
.ai-take{background:var(--accent-soft);border-radius:10px;padding:10px 12px;color:var(--text)}
.rv-layout{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.rv-side{position:sticky;top:16px}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big small{display:block;font-size:13px;font-weight:400;color:var(--text-3);letter-spacing:0;margin-top:6px}
.dist{display:grid;gap:4px}
.dist-row{display:grid;grid-template-columns:28px 1fr 36px;gap:8px;align-items:center;border:0;background:none;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text-2)}
.dist-row:hover,.dist-row[aria-pressed="true"]{background:var(--surface-2)}
.dist-row .bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden} .dist-row .bar i{display:block;height:100%;background:var(--text-2);border-radius:9px}
.dist-row[aria-pressed="true"] .bar i{background:var(--accent)} .dist-row .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-3)}
.rv-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.rv{padding:14px 0;border-top:1px solid var(--line)} .rv p{margin:6px 0;white-space:pre-wrap;font-size:14.5px}
.rv-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stars{color:#f5a524;letter-spacing:1px;font-size:14px} .stars span{color:var(--line-strong)}
.rv.flash{animation:flash 1.6s ease-out} @keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.timeline{list-style:none;padding:0;margin:0}
.timeline > li{display:grid;grid-template-columns:18px 1fr;gap:14px;position:relative;padding-bottom:22px}
.timeline > li:not(:last-child)::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl-dot{width:12px;height:12px;border-radius:99px;border:2px solid var(--line-strong);background:var(--surface);margin:5px 0 0 3px}
.tl-dot.now{background:var(--accent);border-color:var(--accent)}
.tl-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
pre.desc{white-space:pre-wrap;font:14px/1.6 inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0}
@media (max-width:820px){ .ai-grid{grid-template-columns:1fr} .rv-layout{grid-template-columns:1fr} .rv-side{position:static} .app-ai .meta{display:none} }

/* lightbox & modal */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:rgba(10,10,10,.72);backdrop-filter:blur(4px)}
.lb{display:flex;gap:24px;align-items:flex-start;justify-content:center;padding:24px}
.lb figure{margin:0;text-align:center;color:#ddd;font-size:13px}
.lb img{max-height:82vh;max-width:42vw;border-radius:18px;display:block;margin-bottom:8px}
.modal{background:var(--surface);color:var(--text);border-radius:18px;padding:24px;width:min(520px,92vw)}
.modal h3{margin:0 0 6px;font-size:18px}
.modal ol{padding-left:20px;color:var(--text-2)}
.modal code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:13px}
.close{position:fixed;top:16px;right:20px;background:rgba(255,255,255,.12);color:#fff;border:0;width:36px;height:36px;border-radius:99px;cursor:pointer;font-size:18px}

@media (max-width:720px){
  .wrap{padding:22px 16px 60px}
  .row{grid-template-columns:40px 1fr;padding:14px 16px}
  .row .icon{width:40px;height:40px}
  .row-right{grid-column:2;justify-content:flex-start}
  .cmpx{grid-template-columns:52px repeat(var(--n),112px)}.tile,.tile img,.tile.none{width:112px}
  .cell{flex-direction:column;min-height:0;padding:8px}
  .cell img,.cell .none{width:100%}
  .textdiff{grid-template-columns:1fr}
  input[type=search]{max-width:none;min-width:0}
  .lb{flex-direction:column;align-items:center}
  .lb img{max-width:80vw;max-height:40vh}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Store Watch</h1>
      <p class="sub">Weekly snapshots of competitor App Store &amp; Google Play listings — screenshots, icon, name, price, versions, description and reviews, with an AI read on what each release added, changed and removed. Changes land here as soon as they ship.</p>
    </div>
    <div class="meta" id="lastRun"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="activity" aria-selected="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 8.5h3l2-5 3 9 2-4h3"/></svg>
      Activity <span class="count" id="cActivity">0</span></button>
    <button class="tab" role="tab" data-tab="watchlist" aria-selected="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4.5" cy="10" r="3"/><circle cx="11.5" cy="10" r="3"/><path d="M7.5 10h1M3 7l1.5-4h1M13 7l-1.5-4h-1"/></svg>
      Watchlist <span class="count" id="cWatch">0</span></button>
  </nav>

  <main id="view"></main>
</div>

<dialog id="lightbox"><button class="close" aria-label="Close">✕</button><div class="lb" id="lbBody"></div></dialog>
<dialog id="addModal"><div class="modal" id="addBody"></div></dialog>

<script>
const TYPES = {
  screenshots:{label:"Screenshots", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 11l3.5-3 3 2.5 2-1.5L14 11"/></svg>'},
  release:{label:"Release", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5l6 3.2v6.6l-6 3.2-6-3.2V4.7z"/><path d="M2 4.7l6 3.2 6-3.2M8 8v6.5"/></svg>'},
  icon:{label:"Icon", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="11" height="11" rx="3"/></svg>'},
  title:{label:"Name", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h10M8 4v9"/></svg>'},
  price:{label:"Price", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8.5 1.5h6v6L7 15 1 9z"/><circle cx="11" cy="5" r="1"/></svg>'},
  description:{label:"Description", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h10M3 8h10M3 12h6"/></svg>'},
  rating:{label:"Rating", icon:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5l2 4.2 4.5.6-3.3 3.1.8 4.5L8 11.8 4 13.9l.8-4.5L1.5 6.3 6 5.7z"/></svg>'},
  reviews:{label:"Reviews", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>'},
  tracking:{label:"Tracking", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.5"/></svg>'},
};
const FILTERS = [["all","All"],["screenshots","Screenshots"],["reviews","Reviews"],["icon","Icon"],["release","Release"],["price","Price"],["text","Text"],["rating","Rating"]];
const S = {feed:null, apps:{}, tab:"activity", filter:"all", app:"all", q:"", store:"all"};
const isPlay = a => a && a.platform === "android";
const appKey = a => a.key || (isPlay(a) ? `gp-${a.country}-${a.id}` : `${a.country}-${a.id}`);
const storeName = a => isPlay(a) ? "Google Play" : "App Store";
const STORE_LOGO = {
  ios: "https://www.google.com/s2/favicons?domain=apps.apple.com&sz=64",
  android: "https://www.google.com/s2/favicons?domain=play.google.com&sz=64",
};
const storeIcon = a => `<img class="store-logo" src="${STORE_LOGO[isPlay(a) ? "android" : "ios"]}" alt="" onerror="this.remove()">`;
const productKey = a => a.group || String(a.name || a.id).split(/\s[-–—|:]\s|:\s|\s-\s/)[0].toLowerCase().replace(/[^a-z0-9]+/g, "");
function productGroups(){
  const g = {};
  for (const a of S.feed.apps){ const pk = productKey(a); (g[pk] ||= {}); g[pk][isPlay(a) ? "android" : "ios"] ||= appKey(a); }
  return g;
}
const siblings = key => productGroups()[productKey(S.apps[key])] || {};
function storeSwitch(key, onHref){
  const sib = siblings(key), cur = isPlay(S.apps[key]) ? "android" : "ios";
  return `<div class="seg store-seg" role="group" aria-label="Store">${[["ios","App Store"],["android","Google Play"]].map(([p,l]) => {
    const k = sib[p]; const logo = `<img class="store-logo" src="${STORE_LOGO[p]}" alt="" onerror="this.remove()">`;
    return k ? `<a href="${onHref(k)}" aria-pressed="${p===cur}" data-k="${k}">${logo}${l}</a>`
             : `<span class="off" title="Not tracked on ${l} yet — add it from the Watchlist">${logo}${l}</span>`;
  }).join("")}</div>`;
}
const storeLabel = a => `${storeName(a)} ${(a?.country||"").toUpperCase()}`;
const storePill = a => `<span class="pill store">${storeIcon(a)}${storeLabel(a)}</span>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = (src, attrs="", fb="") => src ? `<img src="${esc(src)}" loading="${attrs.includes("eager")?"eager":"lazy"}" referrerpolicy="no-referrer" alt="" ${fb?`onerror="this.onerror=null;this.src='${esc(fb)}'"`:""} ${attrs}>` : "";
const chip = t => `<span class="chip t-${t}">${TYPES[t]?.icon||""}${TYPES[t]?.label||t}</span>`;
const big = u => u && u.includes("mzstatic.com") ? u.replace(/\/[^/]+$/, "/1000x0w.png") : u; // sharper render for the lightbox

function rel(ts){
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s/60)) + "m ago";
  if (s < 86400) return Math.round(s/3600) + "h ago";
  const d = Math.round(s/86400); return d === 1 ? "yesterday" : d + "d ago";
}
function dayLabel(ts){
  const d = new Date(ts), t = new Date(); t.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = (t - dd) / 864e5;
  if (diff === 0) return "Today"; if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year: d.getFullYear()===t.getFullYear()?undefined:"numeric"});
}
function repoInfo(){
  const h = location.hostname, seg = location.pathname.split("/").filter(Boolean)[0];
  if (h.endsWith(".github.io")) { const user = h.split(".")[0]; return {user, repo: seg || h}; }
  return null;
}

async function load(){
  try {
    const r = await fetch("data/feed.json?ts=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    S.feed = await r.json();
  } catch(e) { S.feed = {apps:[], events:[], error:true}; }
  S.apps = Object.fromEntries(S.feed.apps.map(a => [appKey(a), a]));
  $("#cActivity").textContent = S.feed.events.filter(e => e.type !== "tracking").length;
  $("#cWatch").textContent = S.feed.apps.length;
  $("#lastRun").textContent = S.feed.generatedAt ? "Last check " + rel(S.feed.generatedAt) : "";
  route();
}

function route(){
  const h = location.hash.slice(1);
  if (h.startsWith("event/")) return renderDetail(decodeURIComponent(h.slice(6)));
  if (h.startsWith("app/")) { const [k, t] = h.slice(4).split("/"); return renderApp(k, t); }
  if (h === "watchlist") S.tab = "watchlist"; else if (h === "" || h === "activity") S.tab = "activity";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === S.tab));
  S.tab === "watchlist" ? renderWatchlist() : renderActivity();
}
window.addEventListener("hashchange", route);
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { location.hash = t.dataset.tab; });

function matches(e){
  if (S.store !== "all" && (isPlay(S.apps[e.app]) ? "play" : "ios") !== S.store) return false;
  if (S.filter === "text" && !["title","description"].includes(e.type)) return false;
  if (!["all","text"].includes(S.filter) && e.type !== S.filter) return false;
  if (S.app !== "all" && e.app !== S.app) return false;
  if (S.q && !(e.title + " " + e.summary).toLowerCase().includes(S.q.toLowerCase())) return false;
  return true;
}

function firstChange(e){
  const d = e.diff; if (!d) return null;
  if (d.replaced.length) { const i = d.replaced[0]; return [e.before[i], e.after[i]]; }
  if (d.added.length) { const i = d.added[0]; return [e.before[i] || e.before[0], e.after[i]]; }
  if (d.removed.length) { const i = d.removed[0]; return [e.before[i], e.after[i] || e.after[0]]; }
  if (d.moved.length) { const m = d.moved[0]; return [e.before[m.to], e.after[m.to]]; }
  return null;
}

function renderActivity(){
  const evs = S.feed.events.filter(matches);
  const appOpts = Object.entries(S.apps).map(([k,a]) => `<option value="${k}" ${S.app===k?"selected":""}>${esc(a.name)}</option>`).join("");
  let body = "", last = "";
  for (const e of evs){
    const dl = dayLabel(e.ts);
    if (dl !== last){ body += `<div class="day">${dl}</div>`; last = dl; }
    const a = S.apps[e.app] || {};
    let extra = "";
    if (e.type === "screenshots"){ const p = firstChange(e); if (p) extra = `<div class="ba"><figure class="b">${img(p[0])}Before</figure><figure class="a">${img(p[1])}After</figure></div>`; }
    if (e.type === "icon") extra = `<div class="ba"><figure class="b">${img(e.before,'style="width:44px;height:44px"')}Before</figure><figure class="a">${img(e.after,'style="width:44px;height:44px"')}After</figure></div>`;
    const href = e.type === "reviews" ? `#app/${e.app}/reviews` : `#event/${encodeURIComponent(e.id)}`;
    body += `<a class="row" href="${href}">
      ${img(a.icon, 'class="icon"') || '<div class="icon"></div>'}
      <div><div class="row-title">${chip(e.type)}<span>${esc(e.title)}</span></div>
        <div class="row-sum">${esc(e.summary)}</div>${e.ai?`<div class="row-ai">${aiIcon}${esc(e.ai)}</div>`:""}${extra}</div>
      <div class="row-right">${storePill(a)}<span title="${esc(new Date(e.ts).toLocaleString())}">${rel(e.ts)}</span></div></a>`;
  }
  if (!evs.length) body = S.feed.error
    ? `<div class="empty"><b>No data yet</b>Run the “Weekly check” workflow once to capture the first snapshot.</div>`
    : `<div class="empty"><b>Nothing matches</b>Try another filter — or wait for tomorrow's check.</div>`;
  $("#view").innerHTML = `<section class="card">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Store">${[["all","All",""],["ios","App Store","ios"],["play","Google Play","android"]].map(([k,l,p]) => `<button data-s="${k}" aria-pressed="${S.store===k}" class="with-logo">${p?`<img class="store-logo" src="${STORE_LOGO[p]}" alt="" onerror="this.remove()">`:""}${l}</button>`).join("")}</div>
      <select id="appSel" aria-label="App"><option value="all">All apps</option>${appOpts}</select>
      <span class="spacer"></span>
      <input type="search" id="q" placeholder="Search this feed" value="${esc(S.q)}">
    </div>${body}</section>`;
  $("#view").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.filter = b.dataset.f; renderActivity(); });
  $("#view").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { S.store = b.dataset.s; renderActivity(); });
  $("#appSel").onchange = e => { S.app = e.target.value; renderActivity(); };
  const q = $("#q"); q.oninput = e => { S.q = e.target.value; const pos = q.selectionStart; renderActivity(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); };
}

let viewMode = "side";
function renderDetail(id){
  const e = S.feed.events.find(x => x.id === id);
  if (!e){ $("#view").innerHTML = `<section class="card"><div class="empty"><b>Change not found</b><a href="#activity">Back to activity</a></div></section>`; return; }
  const a = S.apps[e.app] || {};
  let content = "";
  if (e.type === "screenshots"){
    content = `<div class="seg viewtoggle" role="group">
      <button data-v="side" aria-pressed="${viewMode==="side"}">Side by side</button>
      <button data-v="groups" aria-pressed="${viewMode==="groups"}">Added / Removed</button></div>` +
      (viewMode === "side" ? sideBySide(e) : groups(e));
  } else if (e.type === "tracking"){
    content = `<div class="sect">Baseline (${e.after.length})</div><div class="strip">${e.after.map((u,i) => shot(u, "", `#${i+1}`, [u])).join("")}</div>`;
  } else if (e.type === "icon"){
    content = `<div class="kv">${img(e.before,'class="icon lg" style="width:120px;height:120px;border-radius:26px"')}<span class="arrow">→</span>${img(e.after,'class="icon lg" style="width:120px;height:120px;border-radius:26px"')}</div>`;
  } else if (e.type === "description"){
    content = textDiff(e.before || "", e.after || "");
  } else {
    content = `<div class="kv"><span class="v" style="color:var(--text-3)">${esc(e.before)}</span><span class="arrow">→</span><span class="v">${esc(e.after)}</span></div>`;
    if (e.ai) content += `<div class="v-ai" style="margin-top:18px"><p class="v-sum">${aiIcon}${esc(e.ai)}</p></div>`;
    if (e.notes) content += `<div class="sect">What's new</div><div class="notes">${esc(e.notes)}</div>`;
    if (e.type === "release") content += `<p class="meta" style="margin-top:14px"><a href="#app/${e.app}/versions">Full version history & AI analysis →</a></p>`;
  }
  $("#view").innerHTML = `<section class="card">
    <div class="dhead"><button class="back" aria-label="Back" onclick="history.length>1?history.back():location.hash='activity'">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg></button>
      ${img(a.icon,'class="icon lg"')}
      <div><div class="dname">${esc(a.name)}</div><div class="meta">${storeLabel(a)} · ${rel(e.ts)} · <a href="${esc(a.url)}" target="_blank" rel="noopener">Open listing ↗</a></div></div></div>
    <div class="dbody"><h2 class="dtitle">${chip(e.type)}${esc(e.title)}</h2><p class="dsum">${esc(e.summary)}${e.device && e.device!=="iPhone" ? " · "+esc(e.device) : ""}</p>${content}</div></section>`;
  $("#view").querySelectorAll("[data-v]").forEach(b => b.onclick = () => { viewMode = b.dataset.v; renderDetail(id); });
  bindZoom();
  window.scrollTo({top:0});
}

function shot(u, cls, cap, pair){
  return `<button class="shot ${cls}" data-zoom='${esc(JSON.stringify(pair))}'>${img(u)}<div class="cap">${cap}</div></button>`;
}
function groups(e){
  const d = e.diff;
  let h = `<div class="sect add">Added (${d.added.length})</div>`;
  h += d.added.length ? `<div class="strip">${d.added.map(i => shot(e.after[i], "add", `Slot #${i+1}`, [e.before[i], e.after[i]].filter(Boolean))).join("")}</div>` : `<p class="meta">None</p>`;
  h += `<div class="sect rem">Removed (${d.removed.length})</div>`;
  h += d.removed.length ? `<div class="strip">${d.removed.map(i => shot(e.before[i], "rem", `Was #${i+1}`, [e.before[i]])).join("")}</div>` : `<p class="meta">None</p>`;
  if (d.moved.length) h += `<div class="sect">Reordered (${d.moved.length})</div><div class="strip">${d.moved.map(m => shot(e.after[m.to], "", `#${m.from+1} → #${m.to+1}`, [e.after[m.to]])).join("")}</div>`;
  return h;
}
function sideBySide(e){
  const d = e.diff, n = Math.max(e.before.length, e.after.length);
  const added = new Set(d.added), removed = new Set(d.removed), repl = new Set(d.replaced);
  const moved = Object.fromEntries(d.moved.map(m => [m.to, m.from]));
  let before = "", after = "", heads = "";
  for (let i = 0; i < n; i++){
    const b = e.before[i], a = e.after[i];
    let tag = "", cls = "";
    if (repl.has(i)) { tag = `<span class="badge b-rep">Replaced</span>`; cls = "chg"; }
    else if (a && added.has(i)) { tag = `<span class="badge b-new">New</span>`; cls = "chg"; }
    else if (a && i in moved) { tag = `<span class="badge b-move">From #${moved[i]+1}</span>`; cls = "chg"; }
    else if (!a && b) { tag = `<span class="badge b-rem">Removed</span>`; cls = "chg"; }
    else if (b && removed.has(i)) { tag = `<span class="badge b-rem">Removed</span>`; cls = "chg"; }
    const pair = esc(JSON.stringify([b, a].filter(Boolean)));
    const tile = (u, side) => u ? `<button class="tile ${cls} ${side}" data-zoom='${pair}'>${img(u)}</button>` : `<div class="tile none"><span>—</span></div>`;
    heads += `<div class="colh"><span>#${i+1}</span>${tag}</div>`;
    before += tile(b, "b"); after += tile(a, "a");
  }
  return `<div class="cmpx" style="--n:${n}">
    <div class="rowlab"></div>${heads}
    <div class="rowlab">Before<small>${e.before.length}</small></div>${before}
    <div class="rowlab">After<small>${e.after.length}</small></div>${after}</div>
    <p class="meta" style="margin-top:6px">Tap any slot to compare full size. Unchanged slots are dimmed.</p>`;
}
function textDiff(a, b){
  const A = a.split("\n"), B = b.split("\n");
  // LCS line diff (descriptions are short enough for O(n·m))
  const m = A.length, n = B.length, L = Array.from({length:m+1}, () => new Int32Array(n+1));
  for (let i = m-1; i >= 0; i--) for (let j = n-1; j >= 0; j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0,j=0,left="",right="";
  while (i<m || j<n){
    if (i<m && j<n && A[i]===B[j]){ left += esc(A[i])+"\n"; right += esc(B[j])+"\n"; i++; j++; }
    else if (j<n && (i>=m || L[i][j+1] >= L[i+1][j])){ right += `<span class="ins">${esc(B[j])||" "}</span>\n`; j++; }
    else { left += `<span class="del">${esc(A[i])||" "}</span>\n`; i++; }
  }
  return `<div class="textdiff"><div><div class="sect rem">Before</div><pre>${left}</pre></div><div><div class="sect add">After</div><pre>${right}</pre></div></div>`;
}

/* ---------- App page: screenshots · reviews · versions · description ---------- */
const cache = {};
async function getJSON(path){
  if (path in cache) return cache[path];
  try { const r = await fetch(path + "?ts=" + Date.now()); cache[path] = r.ok ? await r.json() : null; }
  catch(e){ cache[path] = null; }
  return cache[path];
}
const stars = n => `<span class="stars" aria-label="${n} stars">${"★".repeat(n)}<span>${"★".repeat(5-n)}</span></span>`;
const APP_TABS = [["screens","Screenshots"],["reviews","Reviews"],["versions","Versions"],["description","Description"]];
const RV = {star:"all", q:"", sort:"new", limit:30, sIdx:0};

async function renderApp(key, tab){
  const a = S.apps[key];
  if (!a){ $("#view").innerHTML = `<section class="card"><div class="empty"><b>App not found</b><a href="#watchlist">Back to watchlist</a></div></section>`; return; }
  tab = APP_TABS.some(t => t[0]===tab) ? tab : "screens";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === "watchlist"));
  const rs = a.reviewStats?.d30;
  $("#view").innerHTML = `<section class="card">
    <div class="dhead"><button class="back" aria-label="Back" onclick="location.hash='watchlist'">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg></button>
      ${img(a.icon,'class="icon lg"')}
      <div style="min-width:0"><div class="dname">${esc(a.name)}</div>
        <div class="meta">${storeLabel(a)} · ${esc(a.developer)} · ${isPlay(a)&&a.version==="Varies with device"?"updated "+esc((a.versionDate||"").slice(0,10)):"v"+esc(a.version)} · ${a.rating?a.rating.toFixed(2)+"★":""}${rs&&rs.count?` · 30d ${rs.avg}★ from ${rs.count} reviews`:""} · <a href="${esc(a.url)}" target="_blank" rel="noopener">Listing ↗</a></div></div>
      <div class="dhead-right">${storeSwitch(key, k => `#app/${k}/${tab}`)}</div></div>
    <div class="subtabs">${APP_TABS.map(([k,l]) => `<a href="#app/${key}/${k}" class="subtab" aria-current="${k===tab}">${l}</a>`).join("")}</div>
    <div class="dbody" id="appBody"><div class="meta">Loading…</div></div></section>`;
  const body = $("#appBody");
  if (tab === "screens"){
    body.innerHTML = `<div class="sect">${isPlay(a)?"Phone":"iPhone"} · ${a.screenshots.length}</div><div class="strip ${isPlay(a)?"play":""}">${a.screenshots.map((u,i) => shot(u,"",`#${i+1}`,[u])).join("")}</div>` +
      (a.ipadScreenshots?.length ? `<div class="sect">iPad · ${a.ipadScreenshots.length}</div><div class="strip">${a.ipadScreenshots.map((u,i) => shot(u,"",`#${i+1}`,[u])).join("")}</div>` : "") +
      `<p class="meta"><a href="#activity" onclick="S.app='${key}';S.filter='screenshots'">See every screenshot change →</a></p>`;
    bindZoom();
  }
  if (tab === "reviews") return renderReviews(key, body);
  if (tab === "versions") return renderVersions(key, body);
  if (tab === "description") return renderDescriptions(key, body);
}

function distBars(dist){
  const total = Object.values(dist||{}).reduce((s,v)=>s+v,0) || 1;
  return `<div class="dist">${[5,4,3,2,1].map(i => { const v = dist?.[i]||0, p = Math.round(v/total*100);
    return `<button class="dist-row" data-star="${i}" aria-pressed="${RV.star==i}"><span>${i}★</span><span class="bar"><i style="width:${p}%"></i></span><span class="num">${p}%</span></button>`; }).join("")}</div>`;
}

async function renderReviews(key, body){
  const rv = await getJSON(`data/reviews/${key}.json`);
  if (!rv || !rv.reviews?.length){ body.innerHTML = `<div class="empty"><b>No reviews yet</b>They're collected on the next Monday check.</div>`; return; }
  const byId = Object.fromEntries(rv.reviews.map(r => [r.id, r]));
  const summary = "";
  const st = rv.stats || {};
  let list = rv.reviews.filter(r => (RV.star==="all" || r.rating==RV.star) && (!RV.q || (r.title+" "+r.body).toLowerCase().includes(RV.q.toLowerCase())));
  if (RV.sort === "low") list = [...list].sort((x,y) => x.rating-y.rating || y.date.localeCompare(x.date));
  if (RV.sort === "votes") list = [...list].sort((x,y) => (y.votes||0)-(x.votes||0));
  const shown = list.slice(0, RV.limit);
  body.innerHTML = summary + `
    <div class="rv-layout">
      <aside class="rv-side">
        <div class="big">${st.avg ?? "–"}<small>★ avg of ${st.total} collected</small></div>
        <div class="meta" style="margin-bottom:10px">Last 7d: ${st.d7?.count||0} · ${st.d7?.avg ?? "–"}★ &nbsp; Last 30d: ${st.d30?.count||0} · ${st.d30?.avg ?? "–"}★</div>
        ${distBars(st.dist)}
        ${RV.star!=="all" ? `<button class="btn" id="clearStar" style="margin-top:8px">Show all stars</button>` : ""}
      </aside>
      <div class="rv-main">
        <div class="rv-tools"><input type="search" id="rq" placeholder="Search reviews" value="${esc(RV.q)}">
          <select id="rsort"><option value="new">Newest</option><option value="low" ${RV.sort==="low"?"selected":""}>Lowest rating</option><option value="votes" ${RV.sort==="votes"?"selected":""}>Most helpful</option></select>
          <span class="meta">${list.length} reviews</span></div>
        ${shown.map(r => `<article class="rv" id="rv-${esc(r.id)}"><div class="rv-h">${stars(r.rating)}${r.title?`<b>${esc(r.title)}</b>`:""}</div>
          <p>${esc(r.body)}</p>${r.reply?`<div class="reply"><b>Developer reply</b>${esc(r.reply)}</div>`:""}<div class="meta">${esc(r.author)} · v${esc(r.version)} · ${new Date(r.date).toLocaleDateString()}${r.votes?` · ${r.votes} helpful`:""}</div></article>`).join("") || `<p class="meta">No reviews match.</p>`}
        ${list.length > RV.limit ? `<button class="btn" id="more" style="margin-top:12px">Show more</button>` : ""}
      </div></div>`;
  const rerender = () => renderReviews(key, body);
  body.querySelectorAll("[data-star]").forEach(b => b.onclick = () => { RV.star = RV.star==b.dataset.star ? "all" : +b.dataset.star; RV.limit=30; rerender(); });
  $("#clearStar") && ($("#clearStar").onclick = () => { RV.star="all"; rerender(); });
  $("#rsort").onchange = e => { RV.sort = e.target.value; rerender(); };
  $("#more") && ($("#more").onclick = () => { RV.limit += 30; rerender(); });
  const q = $("#rq"); q.oninput = e => { RV.q = e.target.value; RV.limit=30; const p=q.selectionStart; rerender().then(()=>{ const n=$("#rq"); n.focus(); n.setSelectionRange(p,p); }); };
  body.querySelectorAll("[data-goto]").forEach(el => el.onclick = ev => { ev.preventDefault();
    const id = el.dataset.goto; RV.star="all"; RV.q=""; RV.sort="new";
    const idx = rv.reviews.findIndex(r => r.id===id); RV.limit = Math.max(30, idx+1);
    rerender().then(() => { const t = document.getElementById("rv-"+id); if (t){ t.scrollIntoView({behavior:"smooth",block:"center"}); t.classList.add("flash"); } }); });
}
const starIcon = `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5l2 4.2 4.5.6-3.3 3.1.8 4.5L8 11.8 4 13.9l.8-4.5L1.5 6.3 6 5.7z"/></svg>`;
const aiIcon = `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z"/></svg>`;

async function renderVersions(key, body){
  const [h, va] = await Promise.all([getJSON(`data/history/${key}.json`), getJSON(`data/versions_ai/${key}.json`)]);
  if (!h || !h.versions?.length){ body.innerHTML = `<div class="empty"><b>No version history yet</b>It's collected on the next Monday check.</div>`; return; }
  const a = S.apps[key], ai = va?.versions || {}, ov = va?.overview, cad = va?.cadence, err = va?.lastError;
  const note = isPlay(a) ? `<p class="meta">Google Play doesn't publish version history, so it's built from the day tracking started. Many Play apps report “Varies with device” — updates are then tracked by release date.</p>` : h.backfill && !h.backfill.ok ? `<p class="meta">Older versions couldn't be read from the App Store page, so history starts when tracking began. It retries on every check.</p>` : "";
  const list = (label, cls, arr) => arr?.length ? `<div class="vl ${cls}"><span>${label}</span><ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  let card = `<div class="ai empty-ai"><div class="ai-label">${aiIcon}AI release analysis</div>
    ${err ? `<p class="ai-err"><b>Last attempt failed</b> ${rel(err.ts)} — ${esc(err.message)}</p>` : ""}
    <p class="meta" style="margin:6px 0 0">Each new version is analyzed once on the Monday check — what was added, changed, removed and fixed. To run it now: Actions → Weekly check → Run workflow.</p></div>`;
  if (ov){
    card = `<div class="ai">
      <div class="ai-top"><div class="ai-label">${aiIcon}AI release analysis</div><span class="meta">${cad?.text ? esc(cad.text) : ""}</span></div>
      <h3 class="ai-headline">${esc(ov.headline)}</h3>
      <div class="meta">Based on the last ${ov.basedOn?.length || 0} versions · updated ${rel(ov.ts)} · ${esc(ov.model)}</div>
      <div class="ai-grid two">
        <div class="ai-col c-req"><div class="ai-h">Where it's heading</div>${(ov.themes||[]).map(t => `<div class="ai-item"><div class="ai-pt"><b>${esc(t.point)}</b>${t.versions?.length?`<span class="mentions">${t.versions.slice(0,3).map(v=>"v"+esc(v)).join(", ")}</span>`:""}</div><p>${esc(t.detail||"")}</p></div>`).join("") || `<p class="meta">Nothing notable</p>`}</div>
        <div class="ai-col c-pain"><div class="ai-h">Removed or de-emphasized</div>${(ov.removed||[]).length ? `<ul class="plain">${ov.removed.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="meta">Nothing removed in this period</p>`}</div>
      </div>
      ${ov.takeaway ? `<div class="ai-take"><b>Takeaway for us</b>${esc(ov.takeaway)}</div>` : ""}
      ${err ? `<p class="ai-err"><b>Last update failed</b> ${rel(err.ts)} — ${esc(err.message)}</p>` : ""}
    </div>`;
  }
  body.innerHTML = card + `<div class="meta" style="margin-bottom:14px">${h.versions.length} versions</div>${note}<ol class="timeline">${h.versions.map((v,i) => {
    const x = ai[v.version];
    const aiBlock = !x ? "" : x.trivial ? `<p class="meta">Maintenance release</p>`
      : `<div class="v-ai"><p class="v-sum">${aiIcon}${esc(x.summary)}</p><div class="v-lists">${list("Added","add",x.added)}${list("Changed","chg",x.changed)}${list("Removed","rem",x.removed)}${list("Fixed","fix",x.fixed)}</div></div>`;
    const notes = v.notes ? (x && !x.trivial ? `<details class="notes-d"><summary>Release notes</summary><div class="notes">${esc(v.notes)}</div></details>` : `<div class="notes">${esc(v.notes)}</div>`) : `<p class="meta">No release notes</p>`;
    return `<li><div class="tl-dot ${i===0?"now":""}"></div><div class="tl-body">
      <div class="tl-h"><b>v${esc(v.version)}</b>${i===0?`<span class="badge b-new">Current</span>`:""}<span class="meta">${v.date?new Date(v.date).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):""}</span></div>
      ${aiBlock}${notes}</div></li>`; }).join("")}</ol>`;
}

async function renderDescriptions(key, body, idx=0){
  const h = await getJSON(`data/history/${key}.json`);
  const d = h?.descriptions || [];
  if (!d.length){ body.innerHTML = `<div class="empty"><b>No description history yet</b>It's collected on the next Monday check.</div>`; return; }
  const cur = d[idx], prev = d[idx+1];
  body.innerHTML = `<div class="rv-tools"><select id="dsel">${d.map((x,i)=>`<option value="${i}" ${i===idx?"selected":""}>${i===0?"Current · ":""}${new Date(x.ts).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}</option>`).join("")}</select>
    <span class="meta">${d.length} version${d.length>1?"s":""} tracked${prev?" · showing changes vs the one before":""}</span></div>
    ${prev ? textDiff(prev.text, cur.text) : `<pre class="desc">${esc(cur.text)}</pre><p class="meta">Changes will show up here as a side-by-side diff.</p>`}`;
  $("#dsel").onchange = e => renderDescriptions(key, body, +e.target.value);
}

S.cardStore = {};
function renderWatchlist(){
  const counts = {}; S.feed.events.forEach(e => { if (e.type!=="tracking") counts[e.app] = (counts[e.app]||0)+1; });
  const groups = Object.entries(productGroups());
  const card = (pk, g) => {
    const k = S.cardStore[pk] && Object.values(g).includes(S.cardStore[pk]) ? S.cardStore[pk] : (g.ios || g.android);
    const a = S.apps[k];
    return `<section class="card app" data-pk="${esc(pk)}">
      <div class="app-top">${img(a.icon,'class="icon lg"')}
        <div class="app-id"><a class="app-name" href="#app/${k}" title="${esc(a.name)}">${esc(a.name)}</a><div class="app-dev" title="${esc(a.developer)}">${esc(a.developer)} · ${esc(a.genre||"")}${a.installs?` · ${esc(a.installs)} installs`:""}</div></div>
        <a class="btn primary" href="#app/${k}">Open</a></div>
      <div class="app-bar">${storeSwitch(k, x => "#")}<button class="btn ghost" data-hist="${k}">Changes · ${counts[k]||0}</button></div>
      <div class="app-stats"><span>Version <b>${esc(isPlay(a)&&a.version==="Varies with device" ? "varies" : a.version)}</b></span><span>Rating <b>${a.rating ? a.rating.toFixed(2) : "–"}</b>${a.ratingCount?` (${Number(a.ratingCount).toLocaleString()})`:""}</span><span>Price <b>${esc(a.price)}</b></span><span>Store <b>${esc(storeLabel(a))}</b></span><span>Tracked since <b>${new Date(a.trackedSince).toLocaleDateString()}</b></span>${a.lastError?`<span style="color:var(--rem)">Last fetch failed ${rel(a.lastError)}</span>`:""}</div>
      <div class="mini ${isPlay(a)?"play":""}">${a.screenshots.map((u,i) => img(u, `data-zoom='${esc(JSON.stringify([u]))}' title="#${i+1}"`)).join("")}</div>
      <div class="app-lines">
        ${a.reviewStats ? `<a class="app-ai" href="#app/${k}/reviews">${starIcon}<span>${a.reviewStats.total} reviews collected · <b>${a.reviewStats.d30?.avg ?? "–"}★</b> last 30d${a.reviewStats.d30?.count?` (${a.reviewStats.d30.count})`:""}</span></a>` : ""}
        ${a.releaseSummary ? `<a class="app-ai" href="#app/${k}/versions">${aiIcon}<span><b>v${esc(a.releaseSummary.version)}:</b> ${esc(a.releaseSummary.summary)}</span></a>`
          : a.releaseHeadline ? `<a class="app-ai" href="#app/${k}/versions">${aiIcon}<span><b>Direction:</b> ${esc(a.releaseHeadline)}</span></a>` : ""}
      </div>
    </section>`;
  };
  const bind = root => {
    root.querySelectorAll("[data-hist]").forEach(b => b.onclick = () => { S.app = b.dataset.hist; S.filter = "all"; location.hash = "activity"; });
    root.querySelectorAll(".store-seg a[data-k]").forEach(el => el.onclick = ev => {
      ev.preventDefault();
      const sec = el.closest("[data-pk]"), pk = sec.dataset.pk;
      S.cardStore[pk] = el.dataset.k;
      sec.outerHTML = card(pk, productGroups()[pk]);
      const fresh = $("#view").querySelector(`[data-pk="${CSS.escape(pk)}"]`); bind(fresh); bindZoom();
    });
  };
  $("#view").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap">
      <div class="meta">${groups.length} products · ${S.feed.apps.length} store listings · checked every Monday</div><button class="btn primary" id="addBtn">+ Add app</button></div>
    <div class="grid wl">${groups.map(([pk, g]) => card(pk, g)).join("") || `<section class="card"><div class="empty"><b>No apps yet</b>Add one to start tracking.</div></section>`}</div>`;
  bind($("#view"));
  $("#addBtn").onclick = openAdd;
  bindZoom();
}

function openAdd(){
  const r = repoInfo();
  const base = r ? `https://github.com/${r.user}/${r.repo}` : null;
  $("#addBody").innerHTML = `<h3>Add an app</h3>
    <p class="meta" style="margin:0 0 12px">Adding runs through GitHub so the list stays in the repo. Takes ~30 seconds.</p>
    <ol><li>Open <b>Add app</b> in GitHub Actions${base?"":" (Actions tab → “Add app”)"}.</li>
    <li>Click <b>Run workflow</b>, paste an App Store <em>or</em> Google Play link. Country is read from the link (<code>/us/</code>, <code>&amp;gl=TR</code>…) or type one — Play links without <code>gl=</code> default to US.</li>
    <li>Refresh this page — the app shows up with its baseline screenshots.</li></ol>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn" onclick="this.closest('dialog').close()">Close</button>
      ${base?`<a class="btn primary" target="_blank" rel="noopener" href="${base}/actions/workflows/add-app.yml">Open “Add app” ↗</a>`:""}</div>`;
  $("#addModal").showModal();
}
$("#addModal").addEventListener("click", e => { if (e.target.id === "addModal") e.target.close(); });

function bindZoom(){
  document.querySelectorAll("[data-zoom]").forEach(el => el.onclick = ev => {
    ev.preventDefault();
    const urls = JSON.parse(el.dataset.zoom);
    const labels = urls.length === 2 ? ["Before","After"] : [""];
    $("#lbBody").innerHTML = urls.map((u,i) => `<figure>${img(big(u), "", u)}${labels[i]||""}</figure>`).join("");
    $("#lightbox").showModal();
  });
}
$("#lightbox").addEventListener("click", () => $("#lightbox").close());

load();
</script>
</body>
</html>
